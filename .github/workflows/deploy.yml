name: Build and Deploy to Render

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build & Verify Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found. Running npm ci..."
            npm ci
          else
            echo "package-lock.json not found. Falling back to npm install..."
            npm install
          fi

      - name: Run Linter (TypeScript Verification)
        run: npm run lint

      - name: Build Full-Stack Application
        run: npm run build

      - name: Print Build Success Log
        run: echo "Full-stack bundle successfully compiled! Output saved to dist/."

  deploy:
    name: Trigger Full-Stack Hosting
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    
    # Registering a native GitHub Environment enables a "View deployment" button on GitHub
    environment:
      name: Production
      url: ${{ steps.set-url.outputs.app_url }}

    steps:
      - name: Set Deployment URL
        id: set-url
        env:
          RENDER_APP_URL_SECRET: ${{ secrets.RENDER_APP_URL }}
          RENDER_APP_URL_VAR: ${{ vars.RENDER_APP_URL }}
        run: |
          URL="https://dashboard.render.com"
          if [ ! -z "$RENDER_APP_URL_SECRET" ]; then
            URL="$RENDER_APP_URL_SECRET"
          elif [ ! -z "$RENDER_APP_URL_VAR" ]; then
            URL="$RENDER_APP_URL_VAR"
          fi
          echo "app_url=$URL" >> $GITHUB_OUTPUT

      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set. Skipping live deployment trigger. Please add it to your GitHub Repository Secrets."
            exit 0
          fi
          echo "Triggering deployment..."
          curl -s "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Deployment successfully triggered!"

      - name: Publish Deployment Link to Job Summary
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          echo "### 🚀 National Housing Delivery Platform Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your repository was successfully built, verified, and sent for hosting!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ ! -z "$RENDER_APP_URL" ]; then
            echo "🔗 **Live Web App Link:** [$RENDER_APP_URL]($RENDER_APP_URL)" >> $GITHUB_STEP_SUMMARY
            echo "💡 _This link has been registered as an active deployment in your GitHub repository! You can now click the **'View deployment'** button directly on your repository homepage or under the Actions tab._" >> $GITHUB_STEP_SUMMARY
          else
            echo "🔗 **Live Web App Link:** _Set the RENDER_APP_URL repository secret in GitHub to see your direct live link here!_" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### ⚙️ How to see your live link directly on GitHub:" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to your GitHub Repository -> **Settings** -> **Secrets and variables** -> **Actions**." >> $GITHUB_STEP_SUMMARY
            echo "2. Create a new Repository Secret named \`RENDER_APP_URL\` and paste your live URL as the value." >> $GITHUB_STEP_SUMMARY
            echo "3. Once set, future action runs will display your custom URL as a clickable **View deployment** button on the GitHub Repository home screen and in this Actions tab!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "⚡ _Deployment orchestrated automatically via GitHub Actions and Render Web Services._" >> $GITHUB_STEP_SUMMARY
